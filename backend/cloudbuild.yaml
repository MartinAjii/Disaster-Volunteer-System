steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/disaster-volunteer-backend",
        "."
      ]

  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "gcr.io/$PROJECT_ID/disaster-volunteer-backend"
      ]

  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "disaster-volunteer-backend",
        "--image",
        "gcr.io/$PROJECT_ID/disaster-volunteer-backend",
        "--platform",
        "managed",
        "--timeout", "300",
        "--region",
        "asia-southeast2",
        "--allow-unauthenticated",
        "--port",
        "3000"
      ]

options:
  logging: CLOUD_LOGGING_ONLY
